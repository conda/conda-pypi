# edit this in https://github.com/conda/infrastructure

name: Prepare authors

on:
  # https://crontab.guru/#0_3_*_*_1
  schedule:
    - cron: '0 3 * * 1'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    if: '!github.event.repository.fork'
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Prepare Authors
        uses: conda/actions/prepare-authors@faab6a942e6e8490cd82eee2f6a2b174dace8e9e # v26.9.1
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          since: tag
          base-branch: main
