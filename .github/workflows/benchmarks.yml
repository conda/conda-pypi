name: Track Benchmarks

on:
  workflow_run:
    workflows: [Test]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: true

jobs:
  track-benchmarks:
    if: >-
      !github.event.repository.fork
      && contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
      && (
        github.event.workflow_run.event == 'pull_request'
        || (
          github.event.workflow_run.event == 'push'
          && (
            github.event.workflow_run.head_branch == 'main'
            || endsWith(github.event.workflow_run.head_branch, '.x')
          )
        )
      )
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      checks: write
      pull-requests: write
    steps:
      - name: Report benchmarks
        uses: conda/actions/bencher@7413c959e861b1a2f3912dcfc7a20cfa9a71aa54
        with:
          project: conda-pypi
          api-key: ${{ secrets.BENCHER_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-policy: percentage
          ci-id: conda-pypi wheel builds
